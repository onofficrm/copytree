name: Remove board spam

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Site origin
        required: true
        type: string
      mode:
        description: preview or delete
        required: true
        default: preview
        type: string

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove spam posts
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          SITE_URL: ${{ inputs.site_url }}
          MODE: ${{ inputs.mode }}
          PHP_B64: 
        run: |
          set -euo pipefail
          case "$MODE" in
            preview|delete) ;;
            *) echo "bad mode"; exit 1 ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          TOKEN=$(openssl rand -hex 16)
          FNAME="sc_${TOKEN}.php"
          echo "$PHP_B64" | tr -d '\n' | base64 -d | sed "s/__TOKEN__/${TOKEN}/" > "/tmp/${FNAME}"
          export LFTP_PASSWORD="$FTP_PASSWORD"
          upload() {
            local dest="$1"
            lftp --env-password -u "$FTP_USERNAME" -p "$FTP_PORT" "ftp://$FTP_SERVER" -e "set cmd:fail-exit true; set ftp:ssl-allow no; set ssl:verify-certificate no; set net:timeout 40; set net:max-retries 3; put -O ${dest} /tmp/${FNAME}; bye"
          }
          remove_remote() {
            local dest="$1"
            lftp --env-password -u "$FTP_USERNAME" -p "$FTP_PORT" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set ssl:verify-certificate no; set net:timeout 40; rm -f ${dest}/${FNAME}; bye" || true
          }
          DEST="/public_html/bbs"
          if ! upload "$DEST"; then
            DEST="/bbs"
            upload "$DEST"
          fi
          echo "UPLOADED ${SITE_URL%/}/bbs/${FNAME}?token=${TOKEN}&mode=${MODE}"
          set +e
          curl -fsSL --retry 2 --max-time 400 -A "Mozilla/5.0" "${SITE_URL%/}/bbs/${FNAME}?token=${TOKEN}&mode=${MODE}"
          code=$?
          if [ "$code" -eq 22 ]; then
            echo "WAITING_LOCAL_CURL"
            sleep 180
            curl -fsSL --retry 1 --max-time 60 -A "Mozilla/5.0" "${SITE_URL%/}/bbs/${FNAME}?token=${TOKEN}&mode=${MODE}" || true
            code=0
          fi
          set -e
          remove_remote "$DEST"
          remove_remote "/public_html/bbs"
          remove_remote "/bbs"
          exit $code
